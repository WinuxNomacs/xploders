<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xploders demo</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060f;
        color: #eee;
        font: 14px system-ui, sans-serif;
        overflow: hidden;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      .controls {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 8px 14px;
        border: 1px solid #444;
        border-radius: 6px;
        background: #151826;
        color: inherit;
        cursor: pointer;
      }
      button:hover {
        background: #22263a;
      }
    </style>
  </head>
  <body>
    <canvas id="sky"></canvas>
    <div class="controls">
      <button id="fireworks" type="button">Fireworks</button>
      <button id="chicken" type="button">Chicken</button>
      <button id="clear" type="button">Clear</button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
